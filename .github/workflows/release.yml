name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate AppStream & Desktop Entries
        run: |
          sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
          desktop-file-validate io.github.JohnmaDev.ClockTimer.desktop
          appstreamcli validate --no-net io.github.JohnmaDev.ClockTimer.metainfo.xml

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --onefile --windowed \
            --name "Clock-Timer-Linux-x86_64" \
            --add-data "app:app" \
            --add-data "icon.png:." \
            main.py
          chmod +x dist/Clock-Timer-Linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Timer-Linux-x86_64
          path: dist/Clock-Timer-Linux-x86_64

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name "Clock-Timer-Windows-x64" `
            --icon "icon.png" `
            --add-data "app;app" `
            --add-data "icon.png;." `
            main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Timer-Windows-x64
          path: dist/Clock-Timer-Windows-x64.exe

  create-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Clock-Timer-Linux-x86_64
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Clock-Timer-Windows-x64
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Clock-Timer-Linux-x86_64
            release-assets/Clock-Timer-Windows-x64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
