name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (Binary, AppImage, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate AppStream & Desktop Entries
        run: |
          sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils alien rpm
          desktop-file-validate io.github.JohnmaDev.Clock-Timer.desktop
          appstreamcli validate --no-net io.github.JohnmaDev.Clock-Timer.metainfo.xml

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --onefile --windowed \
            --name "Clock-Timer-Linux-x86_64" \
            --add-data "app:app" \
            --add-data "icon.png:." \
            main.py
          chmod +x dist/Clock-Timer-Linux-x86_64

      - name: Build Native Debian (.deb) Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.0"
          fi
          mkdir -p deb_dist/usr/bin deb_dist/usr/share/applications deb_dist/usr/share/icons/hicolor/512x512/apps deb_dist/DEBIAN
          cp dist/Clock-Timer-Linux-x86_64 deb_dist/usr/bin/clock-timer
          cp io.github.JohnmaDev.Clock-Timer.desktop deb_dist/usr/share/applications/
          cp io.github.JohnmaDev.Clock-Timer.png deb_dist/usr/share/icons/hicolor/512x512/apps/
          cat << EOF > deb_dist/DEBIAN/control
          Package: clock-timer
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: JohnmaDev <jhonechavarria0506@gmail.com>
          Description: Always-on-top floating clock and countdown timer widget
           Clock & Timer is a modern, minimalist desktop widget designed to remain
           perpetually visible over games, workspaces, and applications.
          EOF
          dpkg-deb --build deb_dist "dist/Clock-Timer-${VERSION}-amd64.deb"

      - name: Build RedHat / Fedora (.rpm) Package with Alien
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.0"
          fi
          alien --to-rpm --scripts "dist/Clock-Timer-${VERSION}-amd64.deb"
          mv *.rpm dist/ 2>/dev/null || true

      - name: Build Universal Linux AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.0"
          fi
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/512x512/apps
          cp dist/Clock-Timer-Linux-x86_64 AppDir/usr/bin/clock-timer
          cp io.github.JohnmaDev.Clock-Timer.desktop AppDir/
          cp io.github.JohnmaDev.Clock-Timer.png AppDir/
          cp io.github.JohnmaDev.Clock-Timer.png AppDir/usr/share/icons/hicolor/512x512/apps/
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/clock-timer" "$@"
          EOF
          chmod +x AppDir/AppRun
          ./appimagetool --appimage-extract-and-run AppDir "dist/Clock-Timer-${VERSION}-x86_64.AppImage" || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Packages
          path: dist/*

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "Clock & Timer" --icon "icon.ico" --add-data "app;app" --add-data "icon.png;." main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Packages
          path: "dist/Clock & Timer.exe"

  create-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Packages
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Packages
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
