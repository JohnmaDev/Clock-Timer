app-id: io.github.JohnmaDev.ClockTimer
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: clock-timer

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - python3-requirements.json

  - name: clock-timer
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/clock-timer /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r app /app/share/clock-timer/
      - install -D -m644 icon.png /app/share/clock-timer/icon.png
      - install -D -m755 main.py /app/share/clock-timer/main.py
      # Wrapper launcher script
      - |
        cat << 'EOF' > /app/bin/clock-timer
        #!/bin/sh
        exec python3 /app/share/clock-timer/main.py "$@"
        EOF
      - chmod +x /app/bin/clock-timer
      # Desktop entry and AppStream metadata
      - install -D -m644 io.github.JohnmaDev.ClockTimer.desktop /app/share/applications/io.github.JohnmaDev.ClockTimer.desktop
      - install -D -m644 io.github.JohnmaDev.ClockTimer.metainfo.xml /app/share/metainfo/io.github.JohnmaDev.ClockTimer.metainfo.xml
      - install -D -m644 io.github.JohnmaDev.ClockTimer.png /app/share/icons/hicolor/512x512/apps/io.github.JohnmaDev.ClockTimer.png
    sources:
      - type: dir
        path: .
